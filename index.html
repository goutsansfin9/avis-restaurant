
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goût sans fin - Votre avis</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6e4c7;
  display: flex;
  justify-content: center;
  align-items: center;   /* AJOUT */
  min-height: 100vh;     /* AJOUT */
  min-height: 100dvh;    /* AJOUT */*
}
  body::before {
  content: "";
  position: fixed;
  inset: -30px;
  background: url("fond-restaurant.png.png") center / cover no-repeat;
  filter: blur(25px);
  z-index: -1;
}

.page {
  position: relative;
  width: 100%;
  max-width: 1170px;
  aspect-ratio: 1170 / 1600;
  background-image: url("fond-restaurant.png.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

/* ÉTOILES */
.stars {
  position: absolute;
  left: 20%;
  width: 60%;
  top: 61%;
  height: 8%;
  display: flex;
  justify-content: space-between;
}

.star {
  width: 19%;
  border: none;
  background: transparent;
  cursor: pointer;
  color: transparent;
  font-size: clamp(25px, 6vw, 75px);
}

/* BOUTON GOOGLE */
.google {
  position: absolute;
  left: 18%;
  width: 64%;
  top: 70%;
  height: 7%;
  display: block;
  cursor: pointer;
}

/* Adaptation mobile */
@media (max-width: 500px) {
  .page {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="stars">
    <button class="star" aria-label="1 étoile">★</button>
    <button class="star" aria-label="2 étoiles">★</button>
    <button class="star" aria-label="3 étoiles">★</button>
    <button class="star" aria-label="4 étoiles">★</button>
    <button class="star" aria-label="5 étoiles">★</button>
  </div>

  <a class="google"
     href="https://g.page/r/CVWba4RnqjrREAE/review"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Donner mon avis sur Google">
  </a>

</div>

<script>
const stars = document.querySelectorAll(".star");

stars.forEach((star, index) => {
  star.addEventListener("click", () => {

    stars.forEach((s, i) => {
      s.style.color = i <= index
        ? "#8e2924"
        : "transparent";
    });

    window.open(
      "https://g.page/r/CVWba4RnqjrREAE/review",
      "_blank"
    );
  });
});
</script>

</body>
</html>
